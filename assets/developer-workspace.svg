<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Animated software developer workspace</title>
  <desc id="desc">Pixel-inspired animated scene of a developer coding at a desk with glowing monitors, keyboard activity, plants, shelves, and ambient motion.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233d"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b351f"/>
      <stop offset="0.5" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#4b2d1c"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="monitorGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .pixel { shape-rendering: crispEdges; }
    .code-a { animation: codeA 2.8s steps(5,end) infinite; }
    .code-b { animation: codeB 3.2s steps(6,end) infinite; }
    .code-c { animation: codeC 3.8s steps(7,end) infinite; }
    .type-left { animation: typeLeft .34s steps(2,end) infinite alternate; transform-origin: 537px 370px; }
    .type-right { animation: typeRight .31s steps(2,end) infinite alternate; transform-origin: 655px 370px; }
    .head { animation: headMove 3.2s ease-in-out infinite; transform-origin: 600px 264px; }
    .screen-pulse { animation: screenPulse 4s ease-in-out infinite; }
    .steam { animation: steam 3s ease-in-out infinite; }
    .steam2 { animation: steam 3s ease-in-out 1s infinite; }
    .plant { animation: plant 4.5s ease-in-out infinite; transform-origin: 955px 248px; }
    .clock-hand { animation: tick 6s steps(12,end) infinite; transform-origin: 1061px 84px; }
    .cursor { animation: blink 1s steps(2,end) infinite; }
    .ambient { animation: ambient 6s ease-in-out infinite; }
    @keyframes codeA { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes codeB { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes codeC { 0%,100%{opacity:.5} 50%{opacity:.95} }
    @keyframes typeLeft { from{transform:rotate(0deg)} to{transform:rotate(5deg) translateY(2px)} }
    @keyframes typeRight { from{transform:rotate(0deg)} to{transform:rotate(-5deg) translateY(2px)} }
    @keyframes headMove { 0%,100%{transform:rotate(-1deg)} 50%{transform:rotate(2deg)} }
    @keyframes screenPulse { 0%,100%{opacity:.75} 50%{opacity:1} }
    @keyframes steam { 0%{transform:translateY(0);opacity:0} 35%{opacity:.8} 100%{transform:translateY(-28px);opacity:0} }
    @keyframes plant { 0%,100%{transform:rotate(-1deg)} 50%{transform:rotate(2deg)} }
    @keyframes tick { to{transform:rotate(360deg)} }
    @keyframes blink { 0%,45%{opacity:1} 46%,100%{opacity:0} }
    @keyframes ambient { 0%,100%{opacity:.7} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="33" fill="none" stroke="#64748b" stroke-opacity=".22"/>

  <circle class="ambient" cx="205" cy="140" r="160" fill="#0ea5e9" opacity=".08" filter="url(#blur)"/>
  <circle class="ambient" cx="1010" cy="390" r="190" fill="#8b5cf6" opacity=".09" filter="url(#blur)"/>

  <!-- window -->
  <rect x="80" y="42" width="210" height="180" rx="8" fill="#0b1220" stroke="#334155" stroke-width="6"/>
  <rect x="94" y="56" width="182" height="152" fill="#07111f"/>
  <line x1="185" y1="56" x2="185" y2="208" stroke="#334155" stroke-width="4"/>
  <line x1="94" y1="132" x2="276" y2="132" stroke="#334155" stroke-width="4"/>
  <circle cx="238" cy="88" r="18" fill="#fde68a" filter="url(#softGlow)"/>
  <g fill="#cbd5e1" opacity=".7">
    <rect x="115" y="76" width="3" height="3"/><rect x="145" y="95" width="3" height="3"/><rect x="208" y="72" width="3" height="3"/>
  </g>
  <path d="M94 186l40-34 28 21 38-46 76 59v22H94z" fill="#172554"/>
  <path d="M94 197l42-20 30 15 42-28 68 33v11H94z" fill="#0f766e" opacity=".45"/>

  <!-- shelves -->
  <g class="pixel">
    <rect x="330" y="48" width="270" height="12" fill="#3f2d25"/>
    <rect x="342" y="60" width="8" height="83" fill="#3f2d25"/><rect x="582" y="60" width="8" height="83" fill="#3f2d25"/>
    <rect x="355" y="68" width="34" height="62" fill="#2563eb"/><rect x="391" y="78" width="28" height="52" fill="#f97316"/>
    <rect x="421" y="63" width="32" height="67" fill="#10b981"/><rect x="455" y="86" width="42" height="44" fill="#8b5cf6"/>
    <rect x="500" y="72" width="60" height="58" fill="#92400e"/>
    <rect x="620" y="48" width="250" height="12" fill="#3f2d25"/>
    <rect x="634" y="65" width="52" height="38" fill="#1d4ed8"/><rect x="691" y="77" width="42" height="26" fill="#7c3aed"/>
    <rect x="742" y="60" width="28" height="43" fill="#dc2626"/><rect x="774" y="72" width="60" height="31" fill="#166534"/>
  </g>

  <!-- lamp -->
  <circle cx="944" cy="120" r="92" fill="url(#lampGlow)" opacity=".25"/>
  <path d="M902 70h84l-15 50h-54z" fill="#f59e0b" stroke="#92400e" stroke-width="5"/>
  <rect x="938" y="120" width="12" height="73" fill="#92400e"/>

  <!-- clock -->
  <circle cx="1061" cy="84" r="35" fill="#111827" stroke="#64748b" stroke-width="5"/>
  <line class="clock-hand" x1="1061" y1="84" x2="1061" y2="61" stroke="#22d3ee" stroke-width="3"/>
  <line x1="1061" y1="84" x2="1078" y2="95" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="1061" cy="84" r="4" fill="#f8fafc"/>

  <!-- monitor glow -->
  <ellipse class="screen-pulse" cx="600" cy="255" rx="270" ry="145" fill="url(#monitorGlow)" filter="url(#blur)"/>

  <!-- monitors -->
  <g>
    <rect x="345" y="154" width="230" height="150" rx="10" fill="#111827" stroke="#475569" stroke-width="7"/>
    <rect x="359" y="168" width="202" height="122" rx="4" fill="url(#screen)"/>
    <rect x="438" y="304" width="42" height="28" fill="#334155"/><rect x="410" y="330" width="98" height="9" rx="3" fill="#475569"/>

    <rect x="625" y="142" width="260" height="170" rx="10" fill="#111827" stroke="#475569" stroke-width="7"/>
    <rect x="639" y="156" width="232" height="142" rx="4" fill="url(#screen)"/>
    <rect x="733" y="312" width="44" height="24" fill="#334155"/><rect x="702" y="334" width="105" height="9" rx="3" fill="#475569"/>
  </g>

  <!-- code left -->
  <g class="pixel">
    <rect class="code-a" x="378" y="188" width="94" height="8" fill="#22d3ee"/>
    <rect class="code-b" x="378" y="205" width="145" height="8" fill="#a78bfa"/>
    <rect class="code-c" x="396" y="222" width="110" height="8" fill="#34d399"/>
    <rect class="code-a" x="396" y="239" width="132" height="8" fill="#f59e0b"/>
    <rect class="code-b" x="378" y="256" width="70" height="8" fill="#f472b6"/>
    <rect class="cursor" x="454" y="256" width="6" height="9" fill="#f8fafc"/>
  </g>

  <!-- charts right -->
  <g class="pixel">
    <rect x="662" y="180" width="44" height="84" fill="#1e293b"/><rect x="714" y="204" width="44" height="60" fill="#1d4ed8"/>
    <rect x="766" y="190" width="44" height="74" fill="#7c3aed"/><rect x="818" y="168" width="28" height="96" fill="#0891b2"/>
    <polyline points="660,250 702,226 744,238 788,200 838,214" fill="none" stroke="#67e8f9" stroke-width="4" filter="url(#softGlow)"/>
  </g>

  <!-- desk -->
  <rect x="200" y="357" width="800" height="28" rx="6" fill="url(#desk)"/>
  <rect x="250" y="385" width="22" height="112" fill="#3f2d25"/><rect x="925" y="385" width="22" height="112" fill="#3f2d25"/>
  <rect x="276" y="400" width="650" height="10" fill="#2f1d16"/>

  <!-- chair -->
  <rect x="530" y="332" width="140" height="100" rx="28" fill="#1f2937" stroke="#475569" stroke-width="6"/>
  <rect x="554" y="417" width="92" height="18" rx="9" fill="#1f2937"/>
  <rect x="594" y="435" width="12" height="43" fill="#475569"/>
  <line x1="600" y1="474" x2="555" y2="492" stroke="#475569" stroke-width="8"/>
  <line x1="600" y1="474" x2="645" y2="492" stroke="#475569" stroke-width="8"/>

  <!-- developer -->
  <g class="head">
    <rect x="558" y="214" width="84" height="86" rx="24" fill="#8d5524"/>
    <path d="M554 234c7-42 88-54 98 3v22h-16v-23c-13-20-54-20-67 2v21h-15z" fill="#111827"/>
    <rect x="549" y="246" width="12" height="30" rx="6" fill="#334155"/><rect x="639" y="246" width="12" height="30" rx="6" fill="#334155"/>
    <path d="M548 249c-15 0-20 35 3 40" fill="none" stroke="#64748b" stroke-width="7"/>
    <path d="M652 249c15 0 20 35-3 40" fill="none" stroke="#64748b" stroke-width="7"/>
  </g>
  <path d="M530 305c18-30 122-30 140 0l20 104H510z" fill="#0f766e"/>
  <path d="M545 315h110l20 91H525z" fill="#115e59"/>

  <!-- arms typing -->
  <g class="type-left">
    <path d="M544 330c-32 7-49 29-57 51" fill="none" stroke="#8d5524" stroke-width="18" stroke-linecap="round"/>
    <rect x="474" y="374" width="54" height="15" rx="7" fill="#8d5524"/>
  </g>
  <g class="type-right">
    <path d="M656 330c32 7 49 29 57 51" fill="none" stroke="#8d5524" stroke-width="18" stroke-linecap="round"/>
    <rect x="672" y="374" width="54" height="15" rx="7" fill="#8d5524"/>
  </g>

  <!-- keyboard -->
  <rect x="478" y="368" width="245" height="28" rx="7" fill="#111827" stroke="#475569" stroke-width="3"/>
  <g fill="#64748b">
    <rect x="490" y="376" width="18" height="5"/><rect x="514" y="376" width="18" height="5"/><rect x="538" y="376" width="18" height="5"/>
    <rect x="562" y="376" width="18" height="5"/><rect x="586" y="376" width="18" height="5"/><rect x="610" y="376" width="18" height="5"/>
    <rect x="634" y="376" width="18" height="5"/><rect x="658" y="376" width="18" height="5"/><rect x="682" y="376" width="18" height="5"/>
    <rect x="520" y="386" width="140" height="4"/>
  </g>

  <!-- cup steam -->
  <rect x="825" y="329" width="42" height="34" rx="6" fill="#d97706"/>
  <path d="M867 337h13c13 0 13 19 0 19h-13" fill="none" stroke="#d97706" stroke-width="6"/>
  <path class="steam" d="M837 326c-8-12 8-15 0-27" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <path class="steam2" d="M852 326c-8-12 8-15 0-27" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>

  <!-- plant -->
  <g class="plant">
    <rect x="930" y="307" width="54" height="52" rx="8" fill="#8b5a2b"/>
    <path d="M957 307c-4-33-20-46-40-51 2 25 15 42 40 51z" fill="#22c55e"/>
    <path d="M957 307c4-34 22-50 43-56-1 29-16 48-43 56z" fill="#16a34a"/>
    <path d="M957 307c-2-25 4-44 19-58 10 24 3 45-19 58z" fill="#4ade80"/>
  </g>

  <!-- bottom caption -->
  <text x="600" y="505" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14" letter-spacing="2">DESIGN · CODE · SHIP · IMPROVE</text>
</svg>